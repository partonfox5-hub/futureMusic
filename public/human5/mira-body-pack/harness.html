<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Mira body · passthrough harness</title>
  <style>
    html, body { margin: 0; height: 100%; background: #2a2420; color: #f4efe8; font: 15px/1.4 "Segoe UI", sans-serif; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    #ui { position: absolute; left: 16px; bottom: 16px; z-index: 4; }
    button { background: #7eb6ff; color: #111; border: 0; padding: 10px 14px; margin: 0 8px 0 0; font-weight: 700; border-radius: 8px; cursor: pointer; }
    button.ghost { background: transparent; color: #7eb6ff; border: 1px solid #7eb6ff; }
    #hint { position: absolute; left: 16px; top: 16px; z-index: 4; font-size: 12px; text-shadow: 0 1px 4px #000; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hint">MIRA BODY PACK · no house · no guns</div>
  <div id="ui">
    <button type="button" id="ar">Enter passthrough AR</button>
    <button type="button" class="ghost" id="vr">Enter VR</button>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
    import {installMiraBody, enterPassthrough, enterVR, startMiraBodyLoop} from '../mira-body.js';

    const QUEST = /OculusBrowser|Quest/i.test(navigator.userAgent);
    const renderer = new THREE.WebGLRenderer({antialias: !QUEST, alpha: true, powerPreference: 'high-performance'});
    renderer.setPixelRatio(Math.min(devicePixelRatio, QUEST ? 1.25 : 1.5));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.xr.enabled = true;
    renderer.shadowMap.enabled = true;
    renderer.setClearColor(0x6b5e52, 1);
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x6b5e52);
    const rig = new THREE.Group();
    scene.add(rig);
    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 80);
    camera.position.set(0, 1.45, 2.4);
    camera.lookAt(0, 0.95, 0);
    rig.add(camera);
    scene.add(new THREE.HemisphereLight(0xf5f8ff, 0x82766d, 0.72));
    const key = new THREE.DirectionalLight(0xfff4ee, 1.45);
    key.position.set(1.4, 3.2, 2.8);
    key.castShadow = true;
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xe7efff, 0.55);
    fill.position.set(-2.5, 2.2, 2.0);
    scene.add(fill);

    const orbit = new OrbitControls(camera, renderer.domElement);
    orbit.target.set(0, 1.02, 0);
    orbit.enableDamping = true;
    const xrOn = () => renderer.xr.isPresenting;

    const hint = document.getElementById('hint');
    const body = await installMiraBody({scene, renderer, camera, rig, xrOn});
    hint.textContent = 'Mira ready · ' + (body.actor?.displayName || 'body') + ' · grab in XR, orbit on desktop';
    window.miraBody = body;
    startMiraBodyLoop(body, {onFrame: () => { if (!xrOn()) orbit.update(); }});

    document.getElementById('ar').onclick = async () => {
      try {
        orbit.enabled = false;
        await enterPassthrough(body);
        hint.textContent = 'Passthrough AR · light estimate on';
      } catch (e) { hint.textContent = String(e.message || e); }
    };
    document.getElementById('vr').onclick = async () => {
      try {
        orbit.enabled = false;
        await enterVR(body);
        hint.textContent = 'VR';
      } catch (e) { hint.textContent = String(e.message || e); }
    };
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
