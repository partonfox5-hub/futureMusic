<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#3a332c" />
    <title>Human — local</title>
    <style>
      html, body { margin: 0; height: 100%; background: #3a332c; color: #f4efe8; font: 15px/1.45 "Segoe UI", sans-serif; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; position: absolute; inset: 0; z-index: 0; }
      #ui { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; pointer-events: none; padding: 24px; }
      #panel { pointer-events: auto; background: rgba(18,14,12,.88); border: 1px solid #d4af37; border-radius: 14px; padding: 18px 22px; max-width: 420px; }
      h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: .08em; }
      p { margin: 0 0 10px; color: #d8d0c6; }
      button { pointer-events: auto; background: #d4af37; color: #111; border: 0; padding: 10px 16px; margin: 4px 6px 0 0; font-weight: 700; cursor: pointer; border-radius: 8px; }
      button.ghost { background: transparent; color: #d4af37; border: 1px solid #d4af37; }
      #hint { position: absolute; left: 16px; top: 16px; z-index: 21; font-size: 12px; opacity: .9; pointer-events: none; text-shadow: 0 1px 4px #000; }
      #load { position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%); z-index: 21; font-size: 14px; letter-spacing: .12em; text-shadow: 0 1px 4px #000; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="load">LOADING MIRA…</div>
    <div id="hint"></div>
    <div id="ui">
      <div id="panel">
        <h1>HUMAN</h1>
        <p>Custom WebXR human — skinned walk, hair cards, springs. Home network only.</p>
        <button type="button" id="enter">ENTER VR / AR</button>
        <button type="button" class="ghost" id="desk">Desktop look</button>
      </div>
    </div>
    <script type="module" src="/human/engine.js?v=3"></script>
  </body>
</html>
