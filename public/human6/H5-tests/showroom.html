<!doctype html><html><head><meta charset="utf-8"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><style>body{margin:0;background:#c6cbc8;font-family:Arial}#labels{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;pointer-events:none}.label{text-align:center;padding-top:24px;font-size:22px;color:#263535}.label span{display:block;font-size:12px;color:#485652;margin-top:5px}</style></head><body><div id="labels"></div><script type="module">
import * as T from 'three';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {DogModel} from './src/dog/Dog.js';import {DogPaws} from './src/dog/DogPaws.js';import {DogJaw} from './src/dog/DogJaw.js';import {DogTail} from './src/dog/DogTail.js';import {DogFur} from './src/dog/DogFur.js';
const enhanced=!new URL(location).searchParams.has('baseline');let breeds,build;
if(enhanced){const m=await import('./src/dog/PetAppearance.js');breeds=m.PET_BREEDS;build=m.buildPetAppearance;}else breeds=Object.fromEntries(['labrador','beagle','shepherd','british','siamese','maine'].map((n,i)=>[n,{name:n,species:i<3?'dog':'cat'}]));
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1260,840);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.append(renderer.domElement);const env=new T.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;const entries=[];
for(const [id,b]of Object.entries(breeds)){const scene=new T.Scene();scene.background=new T.Color(0xbec7c3);scene.environment=env;scene.environmentIntensity=.35;scene.add(new T.HemisphereLight(0xdaeaff,0x827c6b,.38));const key=new T.DirectionalLight(0xfff3df,2.4);key.position.set(1.4,3,3);key.castShadow=true;key.shadow.mapSize.set(1024,1024);Object.assign(key.shadow.camera,{left:-1.3,right:1.3,top:1.7,bottom:-1.2,near:.1,far:8});key.shadow.normalBias=.008;scene.add(key);const fill=new T.DirectionalLight(0xcee1ff,.12);fill.position.set(-3,1,-1);scene.add(fill);
const model=new DogModel(b.species,enhanced?b:null),paws=new DogPaws(model,{floorHeight:0}),jaw=new DogJaw(model),tail=new DogTail(model);if(enhanced){model.breedId=id;build(model);}const fur=new DogFur(model,renderer,paws.padMaterial);model.compactMeshes();fur.rebindLayers();if(!enhanced)model.setCoat(b.species==='cat'?'#c47a32':'#b68952');scene.add(model.root);
const plane=new T.Mesh(new T.PlaneGeometry(4,4),new T.MeshStandardMaterial({color:0xa4b3ac,roughness:1}));plane.receiveShadow=true;plane.rotation.x=-Math.PI/2;plane.position.y=-.005;scene.add(plane);const camera=new T.PerspectiveCamera(32,1,.03,12);camera.position.set(1.32,1.02,1.84);camera.lookAt(0,.43,.04);entries.push({model,paws,jaw,tail,fur,scene,camera});document.querySelector('#labels').insertAdjacentHTML('beforeend',`<div class="label">${enhanced?b.name:'Previous '+b.species}<span>${enhanced?id+' • connected sculpt & breed coat':'Checkpoint 12'}</span></div>`);}
function draw(){renderer.setScissorTest(true);entries.forEach((e,i)=>{const x=i%3*420,y=i<3?420:0;renderer.setViewport(x,y,420,420);renderer.setScissor(x,y,420,420);e.model.root.updateMatrixWorld(true);e.model.skeleton.update();renderer.render(e.scene,e.camera);});}
window.showroom={entries,renderer,draw};draw();window.ready=true;
</script></body></html>
