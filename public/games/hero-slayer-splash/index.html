<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero Slayer</title>
  <style>
    html,body{margin:0;height:100%;background:#050308;overflow:hidden}
    .stack{position:absolute;inset:0}
    .sky,.land{position:absolute;inset:0;background-size:cover;background-position:center bottom;background-repeat:no-repeat}
    .sky{background-image:url('menu_sky.png'); z-index:0}
    .land{background-image:url('menu_land.png'); z-index:2}
    canvas#fx{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
    .vignette{position:absolute;inset:0;z-index:3;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.55) 100%);pointer-events:none}
  </style>
</head>
<body>
  <div class="stack" aria-hidden="true">
    <div class="sky"></div>
    <canvas id="fx"></canvas>
    <div class="land"></div>
    <div class="vignette"></div>
  </div>
  <script>
    // Soft constellation shimmer only — no title / menu text
    const c = document.getElementById('fx');
    const ctx = c.getContext('2d');
    let W,H,stars=[],t0=performance.now();
    function resize(){
      const dpr=devicePixelRatio||1;
      W=c.width=innerWidth*dpr; H=c.height=innerHeight*dpr;
      c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px';
      stars=[]; for(let i=0;i<70;i++) stars.push({x:Math.random()*W,y:Math.random()*H*0.52,r:Math.random()*1.6+0.3,p:Math.random()*6});
    }
    addEventListener('resize',resize); resize();
    function frame(now){
      const t=(now-t0)/1000;
      ctx.clearRect(0,0,W,H);
      stars.forEach(s=>{
        const a=.25+.55*(.5+.5*Math.sin(t*1.8+s.p));
        ctx.globalAlpha=a;
        ctx.fillStyle='#fff8e0';
        ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
      });
      ctx.globalAlpha=1;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
