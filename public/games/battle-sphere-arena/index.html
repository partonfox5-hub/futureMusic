<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Battle Sphere Arena — Browser VR</title>
  <style>
    html, body { margin: 0; height: 100%; background: #02040a; color: #d8fff0; font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
    canvas { display: none; width: 100%; height: 100%; }
    body.playing canvas { display: block; }
    body.playing #bg-trailer { display: none; }
    #bg-trailer {
      position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; background: #041018;
    }
    #hud, #hint { display: none; }
    body.playing #hud, body.playing #hint { display: block; }
    #hud {
      position: fixed; top: 18px; left: 22px; z-index: 5; pointer-events: none;
      text-shadow: 0 0 12px #00ff88;
      font-variant-numeric: tabular-nums;
    }
    #hud .power { font-size: 22px; letter-spacing: 0.12em; }
    #hud .sub { opacity: 0.75; font-size: 13px; margin-top: 4px; }
    #start {
      position: fixed; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, rgba(0,40,30,0.55), rgba(0,0,0,0.88));
    }
    #start .panel {
      width: min(520px, 92vw); background: rgba(6,10,16,0.92); border: 1px solid #d4af37;
      padding: 28px 26px; border-radius: 8px;
    }
    #start h1 { font-family: Georgia, serif; color: #d4af37; margin: 0 0 10px; letter-spacing: 0.06em; }
    #start p { color: #c8d4cc; line-height: 1.5; }
    #start button {
      appearance: none; border: 0; cursor: pointer; width: 100%; margin-top: 10px;
      padding: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      background: linear-gradient(45deg, #aa8c2c, #d4af37); color: #111; border-radius: 4px;
    }
    #start button.ghost { background: transparent; color: #20b2aa; border: 1px solid #20b2aa; margin-top: 8px; }
    #hint { position: fixed; bottom: 16px; left: 0; right: 0; text-align: center; font-size: 12px; opacity: 0.65; z-index: 5; pointer-events: none; }
  </style>
</head>
<body>
  <video id="bg-trailer" autoplay muted loop playsinline poster="/images/battle-sphere-arena/cover.jpg">
    <source src="/games/battle-sphere-arena/trailer.mp4" type="video/mp4" />
  </video>
  <div id="hud">
    <div class="power" id="power">POWER 1000/1000  x1.00</div>
    <div class="sub" id="score">00:00 · 0</div>
  </div>
  <div id="hint">WASD fly · mouse look · click laser · Q/E roll · Enter VR on a headset</div>
  <div id="start">
    <div class="panel">
      <p style="letter-spacing:0.28em;text-transform:uppercase;color:#20b2aa;font-size:11px;font-weight:700;margin:0 0 8px">Future Music Collective</p>
      <h1>BATTLE SPHERE ARENA</h1>
      <p>Zero-g coliseum. Keep power above zero. Cut drones before they drain you. Browser + WebXR.</p>
      <button type="button" id="go-desk">Play in browser</button>
      <button type="button" class="ghost" id="go-vr">Enter VR</button>
    </div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="/games/battle-sphere-arena/game.js"></script>
</body>
</html>
