<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#3a332c" />
    <title>Human — pass 2</title>
    <style>
      html, body { margin: 0; height: 100%; background: #3a332c; color: #f4efe8; font: 15px/1.45 "Segoe UI", sans-serif; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; position: absolute; inset: 0; z-index: 0; }
      #ui { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; pointer-events: none; padding: 24px; }
      #panel { pointer-events: auto; background: rgba(18,14,12,.88); border: 1px solid #7eb6ff; border-radius: 14px; padding: 18px 22px; max-width: 440px; }
      h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: .08em; }
      .tag { display: inline-block; font-size: 11px; letter-spacing: .14em; color: #7eb6ff; border: 1px solid #7eb6ff; padding: 2px 8px; margin-bottom: 8px; }
      p { margin: 0 0 10px; color: #d8d0c6; }
      button { pointer-events: auto; background: #7eb6ff; color: #111; border: 0; padding: 10px 16px; margin: 4px 6px 0 0; font-weight: 700; cursor: pointer; border-radius: 8px; }
      button.ghost { background: transparent; color: #7eb6ff; border: 1px solid #7eb6ff; }
      #hint { position: absolute; left: 16px; top: 16px; z-index: 21; font-size: 12px; opacity: .9; pointer-events: none; text-shadow: 0 1px 4px #000; }
      #load { position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%); z-index: 21; font-size: 14px; letter-spacing: .12em; text-shadow: 0 1px 4px #000; }
      #stats { position: absolute; right: 16px; top: 16px; z-index: 21; font: 12px/1.4 ui-monospace, Consolas, monospace; opacity: .9; text-shadow: 0 1px 4px #000; pointer-events: none; }
      #hud { position: absolute; right: 12px; top: 48px; bottom: 12px; z-index: 22; width: 210px; overflow: auto; pointer-events: auto; background: rgba(18,14,12,.82); border: 1px solid #7eb6ff; border-radius: 12px; padding: 12px 14px; font-size: 12px; }
      #hud h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: .12em; color: #7eb6ff; }
      #hud label { display: block; margin: 8px 0 2px; color: #d8d0c6; }
      #hud input { width: 100%; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="load">LOADING PASS 2…</div>
    <div id="hint"></div>
    <div id="stats">PASS 2</div>
    <div id="hud">
      <h2>SHAPE</h2>
      <label>Height</label><input id="sHeight" type="range" min="0.88" max="1.18" step="0.01" value="1" />
      <label>Waist</label><input id="sWaist" type="range" min="0.78" max="1.25" step="0.01" value="1" />
      <label>Breast</label><input id="sBreast" type="range" min="0.7" max="1.45" step="0.01" value="1" />
      <label>Buttocks</label><input id="sButt" type="range" min="0.7" max="1.45" step="0.01" value="1" />
      <label>Thigh width</label><input id="sThigh" type="range" min="0.78" max="1.35" step="0.01" value="1" />
      <label>Thigh gap</label><input id="sGap" type="range" min="-1" max="1" step="0.01" value="0" />
      <p style="margin-top:12px;font-size:11px;opacity:.8">F / mouse hold = noodle · VR trigger grab · swing to strike — jiggle, flinch, head turn from momentum</p>
    </div>
    <div id="ui">
      <div id="panel">
        <div class="tag">PASS 2</div>
        <h1>HUMAN 2</h1>
        <p>CC3 skin + hair cards, hanging arms, flesh springs, shape sliders, pool noodle. Home network only.</p>
        <button type="button" id="enter">ENTER VR / AR</button>
        <button type="button" class="ghost" id="desk">Desktop look</button>
      </div>
    </div>
    <script type="module" src="/human2/engine.js?v=5"></script>
  </body>
</html>
